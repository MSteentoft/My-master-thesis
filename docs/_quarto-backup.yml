project:
  type: book
  output-dir: _book/appendix

book:
  title: ""
  author: ""
  chapters:
    - index.qmd
    - 14-appendix A.qmd
    - 15-appendix B.qmd
    - 16-appendix-references.qmd
    - 17-appendix C.qmd
    - 18-appendix D.qmd

bibliography: references.bib
csl: acta-diabetologica.csl
link-citations: false
csl-hanging-indent: true

format:
  pdf:
    pdf-engine: xelatex
    mainfont: "Times New Roman"
    fontsize: 12pt
    linestretch: 1.5
    documentclass: scrreprt
    classoption: [a4paper]
    toc: false
    number-sections: true
    geometry:
      - top=25mm
      - bottom=25mm
      - left=20mm
      - right=20mm
      - headsep=6mm
      - footskip=9mm
    include-before-body:
      text: |
        \setcounter{page}{43}
    include-in-header:
      text: |
        \RedeclareSectionCommand[beforeskip=10pt,afterskip=5pt]{chapter}
        \RedeclareSectionCommand[beforeskip=8pt,afterskip=4pt]{section}
        \RedeclareSectionCommand[beforeskip=6pt,afterskip=3pt]{subsection}

        \setkomafont{chapter}{\normalfont\bfseries\fontsize{16pt}{18pt}\selectfont}
        \setkomafont{section}{\normalfont\bfseries\fontsize{14pt}{16pt}\selectfont}
        \setkomafont{subsection}{\normalfont\bfseries\fontsize{12pt}{14pt}\selectfont}
        \setkomafont{disposition}{\normalfont\bfseries}

        \setlength{\parindent}{0pt}
        \setlength{\parskip}{6pt}

        \usepackage{ragged2e}
        \RaggedRight

        \usepackage{hyperref}
        \hypersetup{hidelinks,draft}

        \usepackage{longtable}
        \usepackage{booktabs}
        \usepackage{chngcntr}
        \usepackage{pdflscape}
        \usepackage{etoolbox}
        \usepackage[footsepline]{scrlayer-scrpage}

        \counterwithout{table}{chapter}

        \clearpairofpagestyles
        \lofoot{\normalfont\fontsize{10pt}{12pt}\selectfont Mikkel Errboe Steentoft}
        \lefoot{\normalfont\fontsize{10pt}{12pt}\selectfont Mikkel Errboe Steentoft}
        \rofoot{\normalfont\fontsize{10pt}{12pt}\selectfont Page \thepage\ of 68}
        \refoot{\normalfont\fontsize{10pt}{12pt}\selectfont Page \thepage\ of 68}
        \pagestyle{scrheadings}
        \renewcommand*{\chapterpagestyle}{scrheadings}

        \hyphenpenalty=10000
        \exhyphenpenalty=10000
        \emergencystretch=3em

        \setlength{\csllabelwidth}{1.5em}
        \makeatletter
        \renewenvironment{CSLReferences}[2]{%
          \begin{list}{}{%
            \setlength{\topsep}{0pt}%
            \setlength{\parsep}{0pt}%
            \setlength{\itemsep}{2pt}%
            \setlength{\leftmargin}{0pt}%
            \setlength{\itemindent}{0pt}%
          }%
        }{%
          \end{list}%
        }
        \renewcommand{\CSLRightInline}[1]{%
          \parbox[t]{\dimexpr\linewidth-\csllabelwidth\relax}{%
            \hangindent=1.5em\hangafter=1 #1%
          }%
        }
        \makeatother
